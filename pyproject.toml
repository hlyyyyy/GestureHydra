[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gesturehydra"
version = "0.1.0"
description = "Initial open-source scaffold for the GestureHYDRA research project."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "GestureHYDRA Authors" }
]
dependencies = [
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gesturehydra*"]
