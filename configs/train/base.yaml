experiment:
  name: gesturehydra_base
  output_dir: outputs/train/gesturehydra_base
  seed: 42

train:
  batch_size: 8
  num_workers: 4
  epochs: 100
  grad_accum_steps: 1
  log_every_n_steps: 50
  save_every_n_epochs: 5

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.01

scheduler:
  name: cosine
  warmup_steps: 1000

loss:
  diffusion_weight: 1.0
  velocity_weight: 1.0
  keypoint_weight: 1.0

runtime:
  device: cuda
  mixed_precision: fp16
